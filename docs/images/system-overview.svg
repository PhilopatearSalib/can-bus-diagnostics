<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="ti de"><title id="ti">System overview</title><desc id="de">Two EK-TM4C123GXL LaunchPads, a diagnostic tool and an ECU, each connected through a CAN transceiver to a 500 kbit/s CAN bus terminated with 120 ohm resistors at both ends. Each board connects to a PC serial terminal over USB.</desc>
<style>
  .t  { font-family: -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .h  { font-weight: 600; }
  .mu { fill: #59636e; }
  .box   { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
  .panel { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
  .node  { fill: #ffffff; stroke: #b4232f; stroke-width: 2; }
  .ext   { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
  .chip  { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  .ln    { stroke: #59636e; stroke-width: 1.5; fill: none; }
  .canh  { stroke: #d4a72c; stroke-width: 4; fill: none; }
  .canl  { stroke: #2da44e; stroke-width: 4; fill: none; }
  .canhT { fill: #9a6700; }
  .canlT { fill: #1a7f37; }
  .pos   { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1; }
  .neg   { fill: #ffebe9; stroke: #cf222e; stroke-width: 1; }
  .neu   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1; }
  .posT  { fill: #1a7f37; }
  .negT  { fill: #cf222e; }
  .acc   { fill: #b4232f; }
  .arrowFill { fill: #59636e; }
  @media (prefers-color-scheme: dark) {
    .t  { fill: #e6edf3; }
    .mu { fill: #9198a1; }
    .box   { fill: #0d1117; stroke: #3d444d; }
    .panel { fill: #151b23; stroke: #3d444d; }
    .node  { fill: #0d1117; stroke: #e5534b; }
    .ext   { stroke: #656c76; }
    .chip  { fill: #212830; stroke: #3d444d; }
    .ln    { stroke: #9198a1; }
    .canhT { fill: #d29922; }
    .canlT { fill: #3fb950; }
    .pos   { fill: #12261e; stroke: #3fb950; }
    .neg   { fill: #2d1517; stroke: #f85149; }
    .neu   { fill: #212830; stroke: #656c76; }
    .posT  { fill: #3fb950; }
    .negT  { fill: #f85149; }
    .acc   { fill: #e5534b; }
    .arrowFill { fill: #9198a1; }
  }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowFill"/></marker></defs><line x1="70" y1="312" x2="890" y2="312" class="canh"/><line x1="70" y1="352" x2="890" y2="352" class="canl"/><line x1="70" y1="312" x2="70" y2="352" class="ln"/><rect x="64" y="320" width="12" height="24" rx="2" class="box" style="stroke-width:1.8"/><line x1="890" y1="312" x2="890" y2="352" class="ln"/><rect x="884" y="320" width="12" height="24" rx="2" class="box" style="stroke-width:1.8"/><text x="84" y="336.0" class="t mu" font-size="12" text-anchor="start" >120 Ω</text><text x="876" y="336.0" class="t mu" font-size="12" text-anchor="end" >120 Ω</text><text x="70" y="302" class="t canhT h" font-size="12" text-anchor="start" >CANH</text><text x="70" y="372" class="t canlT h" font-size="12" text-anchor="start" >CANL</text><text x="480.0" y="392" class="t mu" font-size="13" text-anchor="middle" >CAN bus, 500 kbit/s, 11-bit identifiers</text><rect x="180.0" y="14" width="180" height="32" rx="6" class="box"/><text x="270.0" y="35" class="t" font-size="13" text-anchor="middle" >PC serial terminal</text><line x1="270.0" y1="47" x2="270.0" y2="76" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="278.0" y="66" class="t mu" font-size="11.5" text-anchor="start" >USB, UART0 115200 8N1</text><rect x="100" y="80" width="340" height="138" rx="8" class="node"/><text x="118" y="106" class="t h" font-size="16" text-anchor="start" >Node 1: Diagnostic Tool</text><text x="118" y="125" class="t mu" font-size="12" text-anchor="start" >EK-TM4C123GXL LaunchPad</text><circle cx="123" cy="146" r="2.5" class="acc"/><text x="133" y="150" class="t" font-size="13" text-anchor="start" >Console requests: 0x10, 0x22, 0x2E</text><circle cx="123" cy="167" r="2.5" class="acc"/><text x="133" y="171" class="t" font-size="13" text-anchor="start" >Buttons PF0 / PF4 send 0x31 / 0x32</text><cir
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="ti de"><title id="ti">Layered architecture of both nodes</title><desc id="de">Both nodes share four layers: application modules, ECU abstraction modules written for this project, the external TI TivaWare driver library, and the TM4C123GH6PM peripherals.</desc>
